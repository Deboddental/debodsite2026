<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <!-- NOTE: Per-page <title>, description, canonical and og/twitter tags are injected
       per route by react-helmet-async (see each page's <Helmet>). Only GLOBAL defaults
       live here so the prerenderer never bakes a second, conflicting canonical/og tag.
       (Helmet replaces <title> but APPENDS link/meta — duplicates here would break dedup.) -->
  <title>Clínica Dental en Argüelles, Madrid — Debod Dental Clinic | Dres. Guerrero & Rodríguez</title>
  <meta name="keywords"
    content="clínica dental Argüelles Madrid, dentista Argüelles, rehabilitación oral Madrid, implantes dentales Madrid, Invisalign Madrid, carillas porcelana Madrid, Dr Víctor Guerrero, Dr César Rodríguez, Debod Dental Clinic" />

  <!-- Open Graph / Twitter — global defaults only (per-page values come from Helmet) -->
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://deboddentalclinic.com/og-image.jpg" />
  <!-- og:locale is set per-page via Helmet (es_ES default in RootLayout, en_GB on /en/ pages)
       so EN pages don't inherit a conflicting second og:locale tag. -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Structured Data: MedicalClinic + LocalBusiness -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["MedicalClinic", "LocalBusiness", "Dentist"],
          "@id": "https://deboddentalclinic.com/#clinic",
          "name": "Debod Dental Clinic",
          "description": "Clínica dental de referencia en Argüelles, Madrid, especializada en Rehabilitación Oral integral, Implantología Digital y Estética Dental. Dirigida por los Dres. Víctor Guerrero y César Rodríguez. Premio WhiteSmile 2023.",
          "url": "https://deboddentalclinic.com",
          "telephone": "+34914476225",
          "email": "info@deboddentalclinic.com",
          "image": "https://deboddentalclinic.com/og-image.jpg",
          "priceRange": "€€€",
          "currenciesAccepted": "EUR",
          "paymentAccepted": "Cash, Credit Card, Financing",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "C. de Ferraz, 24",
            "addressLocality": "Madrid",
            "addressRegion": "Comunidad de Madrid",
            "postalCode": "28008",
            "addressCountry": "ES"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": "40.4249",
            "longitude": "-3.7157"
          },
          "areaServed": {
            "@type": "City",
            "name": "Madrid"
          },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
              "opens": "09:00",
              "closes": "20:00"
            }
          ],
          "_comment_aggregateRating": "SOURCING: ratingValue/reviewCount below come from the clinic's Google Business Profile (also shown live by the Elfsight widget on /resenas/) and MUST stay in sync with ratingSummary in src/data/reviews.js. Verify against the real Google profile before changing (current verifiedOn: 2026-06-26).",
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.9",
            "reviewCount": "350",
            "bestRating": "5",
            "worstRating": "1"
          },
          "award": "Premio WhiteSmile 2023",
          "sameAs": [
            "https://www.instagram.com/debodclinicadental/",
            "https://www.facebook.com/debodclinicadental/"
          ],
          "hasMap": "https://maps.google.com/?q=C.+de+Ferraz,+24,+28008+Madrid",
          "medicalSpecialty": [
            "Dentistry",
            "Oral and Maxillofacial Surgery",
            "Prosthodontics",
            "Orthodontics",
            "Periodontics",
            "Endodontics",
            "Pediatric Dentistry"
          ]
        },
        {
          "@type": "Person",
          "@id": "https://deboddentalclinic.com/equipo/dr-victor-guerrero/#person",
          "name": "Dr. Víctor Guerrero",
          "jobTitle": "Especialista en Ortodoncia y Ortopedia Dentofacial",
          "worksFor": {"@id": "https://deboddentalclinic.com/#clinic"},
          "url": "https://deboddentalclinic.com/equipo/dr-victor-guerrero/",
          "description": "Ortodoncista y experto en ortopedia dentofacial. Referente internacional en ortodoncia invisible y anclaje esquelético cortical con mini-tornillos OBS. Más de 15 años de experiencia. Ponente en Europa y América Latina."
        },
        {
          "@type": "Person",
          "@id": "https://deboddentalclinic.com/equipo/dr-cesar-rodriguez/#person",
          "name": "Dr. César Rodríguez",
          "jobTitle": "Prostodoncista y Especialista en Rehabilitación Oral",

          "url": "https://deboddentalclinic.com/equipo/dr-cesar-rodriguez/",

        },
        {
          "@type": "WebSite",
          "@id": "https://deboddentalclinic.com/#website",
          "url": "https://deboddentalclinic.com",
          "name": "Debod Dental Clinic",
          "description": "Sitio oficial de Debod Dental Clinic — Clínica dental en Argüelles, Madrid",
          "inLanguage": "es-ES",
          "publisher": {"@id": "https://deboddentalclinic.com/#clinic"}
        }
      ]
    }
    </script>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />

  <!-- Fonts: non-render-blocking load (replaces the CSS @import that blocked LCP).
       Early-discovered + async via media-swap; display=swap shows text immediately. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" />
  </noscript>
</head>

<body>
  <div id="root"></div>

</body>

</html>
